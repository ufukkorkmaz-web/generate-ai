<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Train Your Own AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="blobs" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
<div id="glow" aria-hidden="true"></div>

<!-- SCREEN 1: fake code terminal + name input -->
<section id="screen-boot" class="screen active">
  <div class="terminal">
    <div id="bootLog" class="boot-log" aria-live="polite"></div>
    <div id="namePrompt" class="name-prompt hidden">
      <p id="savedNote" class="saved-note hidden"></p>
      <label for="nameInput">&gt; Enter a name for your AI:</label>
      <div class="prompt-row">
        <span class="caret-symbol">$</span>
        <input id="nameInput" type="text" maxlength="20" autocomplete="off" spellcheck="false" aria-label="AI name">
      </div>
      <div class="persona" role="radiogroup" aria-label="AI personality">
        <span class="persona-label">&gt; Choose a personality (click, or press &uarr; &darr;):</span>
        <div class="persona-row">
          <button type="button" class="pchip" role="radio" aria-checked="false" data-p="friendly">Friendly</button>
          <button type="button" class="pchip" role="radio" aria-checked="false" data-p="funny">Funny</button>
          <button type="button" class="pchip" role="radio" aria-checked="false" data-p="serious">Serious</button>
          <button type="button" class="pchip" role="radio" aria-checked="false" data-p="robot">Robot</button>
        </div>
        <p id="personaDesc" class="persona-desc"></p>
      </div>
      <p id="nameError" class="error hidden"></p>
      <p class="hint">Press ENTER to continue</p>
    </div>
  </div>
</section>

<!-- SCREEN 2: loading (3 seconds) -->
<section id="screen-loading" class="screen">
  <div class="loading-box">
    <div class="spinner"></div>
    <h2 id="loadingTitle">Waking up...</h2>
    <p id="loadingStatus">Starting neural core...</p>
    <div class="bar"><div id="loadingFill" class="bar-fill"></div></div>
  </div>
</section>

<!-- SCREEN 3: AI interface -->
<section id="screen-app" class="screen">
  <div class="app">
    <header class="app-header">
      <div class="ai-id">
        <div class="avatar" id="avatar" role="img" aria-label="The AI's face"></div>
        <div>
          <h1 id="aiName">AI</h1>
          <p class="status"><span class="dot"></span><span id="moodLabel">Feeling confused</span> &middot; <span id="factCount">0</span> things learned<span id="modeLabel"></span></p>
        </div>
      </div>
      <div class="header-actions">
        <button id="modeBtn" class="primary mode-btn" title="Switch between teaching me and asking me questions">Train me, master!</button>
        <button id="soundBtn" class="icon-btn" type="button" aria-label="Turn sounds off" title="Sounds on/off">
          <svg class="s-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          <svg class="s-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>
        </button>
        <button id="resetBtn" class="ghost" title="Start again with a new AI">Reset</button>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite"></main>

    <footer class="app-footer">
      <form id="chatForm" class="chat-form" autocomplete="off">
        <input id="chatInput" type="text" maxlength="200" disabled placeholder="Press Train me, master! to begin..." aria-label="Message">
        <button type="submit" id="sendBtn" disabled>Send</button>
      </form>
    </footer>
  </div>
</section>

  <script src="script.js"></script>
</body>
</html>
